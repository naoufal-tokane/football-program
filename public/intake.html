<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f14"/>
<title>Athlete Intake Form</title>
<link rel="stylesheet" href="/intake.css"/>
</head>
<body>
<header class="header">
  <button type="button" class="langbtn" id="langBtn" data-dyn>الدارجة</button>
  <h1>Athlete Intake</h1>
  <p id="stepHint" data-dyn>Step 1 of 4 · About you</p>
  <div class="progress"><div class="bar" id="progBar"></div></div>
  <div class="steps" id="stepDots">
    <button type="button" data-go="0" class="on">About</button>
    <button type="button" data-go="1">Training</button>
    <button type="button" data-go="2">Nutrition</button>
    <button type="button" data-go="3">Review</button>
  </div>
</header>

<main class="wrap">
<form id="intakeForm" novalidate>
  <input type="text" name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true"/>

  <!-- STEP 1: ABOUT -->
  <section class="card step active" data-step="0">
    <h2><span class="num">1</span>About you</h2>

    <div class="grid2">
      <div class="field"><label for="full_name">Name *</label><input id="full_name" name="full_name" autocomplete="name" required/></div>
      <div class="field"><label for="contact">Email / phone</label><input id="contact" name="contact" autocomplete="email"/></div>
    </div>

    <div class="grid2">
      <div class="field"><label for="age">Age</label><input id="age" name="age" type="number" inputmode="numeric" min="10" max="100" placeholder="25"/></div>
      <div class="field"><label>Sex</label>
        <div class="chips"><label><input type="radio" name="sex" value="Male"><span>Male</span></label><label><input type="radio" name="sex" value="Female"><span>Female</span></label></div>
      </div>
      <div class="field"><label for="height_cm">Height (cm)</label><input id="height_cm" name="height_cm" type="number" inputmode="decimal" step="0.1" placeholder="178"/></div>
      <div class="field"><label for="weight_kg">Current weight (kg)</label><input id="weight_kg" name="weight_kg" type="number" inputmode="decimal" step="0.1" placeholder="75"/></div>
    </div>
    <div class="live" id="bmiBox" data-dyn hidden></div>

    <div class="field"><label>Main goal <em>select all that apply</em></label>
      <div class="chips multi">
        <label><input type="checkbox" name="goal" value="Fat loss"><span>🔥 Fat loss</span></label>
        <label><input type="checkbox" name="goal" value="Muscle gain"><span>💪 Muscle gain</span></label>
        <label><input type="checkbox" name="goal" value="Body recomposition"><span>⚖️ Recomposition</span></label>
        <label><input type="checkbox" name="goal" value="Sports performance"><span>⚡ Sports performance</span></label>
        <label><input type="checkbox" name="goal" value="Maintenance"><span>🎯 Maintenance</span></label>
        <label><input type="checkbox" name="goal" value="Other"><span>Other</span></label>
      </div>
      <input name="goal_other" class="other" data-for="goal" placeholder="Describe your goal" hidden/>
    </div>

    <div class="grid2">
      <div class="field"><label for="target_weight_kg">Target weight (kg)</label><input id="target_weight_kg" name="target_weight_kg" type="number" inputmode="decimal" step="0.1" placeholder="optional"/></div>
      <div class="field"><label for="timeline">Timeline</label><input id="timeline" name="timeline" placeholder="e.g. 12 weeks, before season"/></div>
    </div>
    <div class="live" id="targetBox" data-dyn hidden></div>
  </section>

  <!-- STEP 2: TRAINING -->
  <section class="card step" data-step="1">
    <h2><span class="num">2</span>Training</h2>

    <div class="field"><label>Sport / context <em>select all that apply</em></label>
      <div class="chips multi">
        <label><input type="checkbox" name="sport" value="Football / soccer"><span>⚽ Football / soccer</span></label>
        <label><input type="checkbox" name="sport" value="Gym only"><span>🏋️ Gym only</span></label>
        <label><input type="checkbox" name="sport" value="General fitness"><span>🤸 General fitness</span></label>
        <label><input type="checkbox" name="sport" value="Running"><span>🏃 Running</span></label>
        <label><input type="checkbox" name="sport" value="Other"><span>Other</span></label>
      </div>
      <input name="sport_other" class="other" data-for="sport" placeholder="Which sport / context?" hidden/>
    </div>

    <div class="field"><label>Days per week <b class="val" id="daysVal" data-dyn>4 days</b></label>
      <input type="range" name="days_per_week" id="days_per_week" min="1" max="7" value="4"/>
      <div class="ticks"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span></div>
    </div>

    <div class="field"><label>Time per session <b class="val" id="minVal" data-dyn>60 min</b></label>
      <input type="range" name="session_minutes" id="session_minutes" min="20" max="150" step="5" value="60"/>
      <div class="ticks"><span>20</span><span>60</span><span>105</span><span>150</span></div>
    </div>
    <div class="live" id="volumeBox" data-dyn></div>

    <div class="field"><label>Do you train twice a day?</label>
      <div class="chips">
        <label><input type="radio" name="two_a_day" value="Yes"><span>Yes</span></label>
        <label><input type="radio" name="two_a_day" value="No"><span>No</span></label>
      </div>
    </div>
    <div id="twiceBox" class="reveal" hidden>
      <div class="field"><label>How many days per week do you train twice?</label>
        <div class="chips days">
          <label><input type="radio" name="two_a_day_days" value="1"><span>1</span></label>
          <label><input type="radio" name="two_a_day_days" value="2"><span>2</span></label>
          <label><input type="radio" name="two_a_day_days" value="3"><span>3</span></label>
          <label><input type="radio" name="two_a_day_days" value="4"><span>4</span></label>
          <label><input type="radio" name="two_a_day_days" value="5"><span>5</span></label>
          <label><input type="radio" name="two_a_day_days" value="6"><span>6</span></label>
          <label><input type="radio" name="two_a_day_days" value="7"><span>7</span></label>
        </div>
      </div>
    </div>

    <div class="field"><label>Team sessions or fixed commitments to build around?</label>
      <div class="chips">
        <label><input type="radio" name="has_commitments" value="Yes"><span>Yes</span></label>
        <label><input type="radio" name="has_commitments" value="No"><span>No</span></label>
      </div>
    </div>
    <div id="commitBox" class="reveal" hidden>
      <div class="field"><label>Which days?</label>
        <div class="chips days">
          <label><input type="checkbox" name="commitment_days" value="Mon"><span>Mon</span></label>
          <label><input type="checkbox" name="commitment_days" value="Tue"><span>Tue</span></label>
          <label><input type="checkbox" name="commitment_days" value="Wed"><span>Wed</span></label>
          <label><input type="checkbox" name="commitment_days" value="Thu"><span>Thu</span></label>
          <label><input type="checkbox" name="commitment_days" value="Fri"><span>Fri</span></label>
          <label><input type="checkbox" name="commitment_days" value="Sat"><span>Sat</span></label>
          <label><input type="checkbox" name="commitment_days" value="Sun"><span>Sun</span></label>
        </div>
      </div>
      <div class="field"><label for="commitment_details">Details</label><input id="commitment_details" name="commitment_details" placeholder="e.g. Team session 11:30 Tue/Thu, match Sunday"/></div>
    </div>

    <div class="field"><label>Equipment access <em>select all that apply</em></label>
      <div class="chips multi">
        <label><input type="checkbox" name="equipment" value="Full gym"><span>🏢 Full gym</span></label>
        <label><input type="checkbox" name="equipment" value="Home / minimal"><span>🏠 Home / minimal</span></label>
        <label><input type="checkbox" name="equipment" value="Bodyweight only"><span>🙌 Bodyweight only</span></label>
      </div>
    </div>

    <div class="field"><label>Experience level</label>
      <div class="chips">
        <label><input type="radio" name="experience" value="Beginner"><span>Beginner</span></label>
        <label><input type="radio" name="experience" value="Intermediate"><span>Intermediate</span></label>
        <label><input type="radio" name="experience" value="Advanced"><span>Advanced</span></label>
      </div>
    </div>

    <div class="field"><label for="injuries">Injuries, limitations or exercises to avoid</label><textarea id="injuries" name="injuries" rows="3" placeholder="None, or describe…"></textarea></div>

    <div class="field"><label>Emphasis <em>select all that apply</em></label>
      <div class="chips multi">
        <label><input type="checkbox" name="emphasis" value="Strength"><span>Strength</span></label>
        <label><input type="checkbox" name="emphasis" value="Conditioning / speed"><span>Conditioning / speed</span></label>
        <label><input type="checkbox" name="emphasis" value="Mobility"><span>Mobility</span></label>
        <label><input type="checkbox" name="emphasis" value="Balanced"><span>Balanced</span></label>
      </div>
      <input name="emphasis_notes" class="mt" placeholder="Anything else? (optional)"/>
    </div>
  </section>

  <!-- STEP 3: NUTRITION -->
  <section class="card step" data-step="2">
    <h2><span class="num">3</span>Nutrition goals</h2>

    <div class="field"><label>Daily macro targets</label>
      <div class="chips">
        <label><input type="radio" name="targets_mode" value="Calculate for me"><span>Calculate for me</span></label>
        <label><input type="radio" name="targets_mode" value="I have my own targets"><span>I have my own targets</span></label>
      </div>
    </div>

    <div id="ownTargets" class="reveal" hidden>
      <div class="grid2">
        <div class="field"><label for="protein_g">Protein (g)</label><input id="protein_g" name="protein_g" type="number" inputmode="decimal" placeholder="160"/></div>
        <div class="field"><label for="carbs_g">Carbs (g)</label><input id="carbs_g" name="carbs_g" type="number" inputmode="decimal" placeholder="300"/></div>
        <div class="field"><label for="fats_g">Fats (g)</label><input id="fats_g" name="fats_g" type="number" inputmode="decimal" placeholder="70"/></div>
        <div class="field"><label for="calories">Calories (auto)</label><input id="calories" name="calories" type="number" readonly placeholder="auto"/></div>
      </div>
      <div class="macrobar" id="macroBar" hidden><i class="p"></i><i class="c"></i><i class="f"></i></div>
      <div class="macrolegend" id="macroLegend" data-dyn></div>
    </div>

    <div id="calcTargets" class="reveal" hidden>
      <div class="field"><label>Activity level</label>
        <div class="levels">
          <label><input type="radio" name="activity_level" value="Sedentary"><span><b>Sedentary</b><small>Desk job, little exercise</small></span></label>
          <label><input type="radio" name="activity_level" value="Lightly active"><span><b>Lightly active</b><small>1–3 sessions / week</small></span></label>
          <label><input type="radio" name="activity_level" value="Moderately active"><span><b>Moderately active</b><small>3–5 sessions / week</small></span></label>
          <label><input type="radio" name="activity_level" value="Very active"><span><b>Very active</b><small>6–7 sessions / week</small></span></label>
          <label><input type="radio" name="activity_level" value="Extremely active"><span><b>Extremely active</b><small>2x / day or physical job</small></span></label>
        </div>
      </div>
    </div>

    <div class="field"><label>Dietary preferences / restrictions</label>
      <div class="chips multi">
        <label><input type="checkbox" name="diet" value="None"><span>None</span></label>
        <label><input type="checkbox" name="diet" value="Vegetarian"><span>Vegetarian</span></label>
        <label><input type="checkbox" name="diet" value="Vegan"><span>Vegan</span></label>
        <label><input type="checkbox" name="diet" value="Halal"><span>Halal</span></label>
        <label><input type="checkbox" name="diet" value="Kosher"><span>Kosher</span></label>
        <label><input type="checkbox" name="diet" value="Gluten-free"><span>Gluten-free</span></label>
        <label><input type="checkbox" name="diet" value="Lactose-free"><span>Lactose-free</span></label>
      </div>
      <input name="diet_other" class="mt" placeholder="Allergies or other restrictions"/>
    </div>

    <div class="field"><label>Water target <b class="val" id="waterVal" data-dyn>3.0 L</b></label>
      <input type="range" name="water_ml" id="water_ml" min="1500" max="5000" step="250" value="3000"/>
      <div class="glasses" id="glasses" data-dyn></div>
    </div>
  </section>

  <!-- STEP 4: REVIEW -->
  <section class="card step" data-step="3">
    <h2><span class="num">4</span>Review</h2>
    <p class="muted">Check your answers. Tap a section to edit it.</p>
    <div id="review" data-dyn></div>
  </section>

  <div class="err" id="formErr" data-dyn></div>
  <div class="nav">
    <button type="button" class="ghost" id="backBtn" hidden>← Back</button>
    <button type="button" class="primary" id="nextBtn">Next →</button>
    <button type="submit" class="primary" id="submitBtn" data-dyn hidden>Submit</button>
  </div>
  <p class="saved" id="savedNote" data-dyn></p>
</form>

<section id="doneBox" class="card done" hidden>
  <div class="check">✓</div>
  <h2>Thanks, your answers were sent.</h2>
  <p class="muted">Keep a copy for yourself:</p>
  <div class="row">
    <button class="ghost" id="copyBtn" data-dyn>Copy answers</button>
    <button class="ghost" id="dlBtn">Download JSON</button>
  </div>
  <pre id="summary" data-dyn></pre>
  <button class="link" id="againBtn">Fill in another form</button>
</section>
</main>

<script src="/intake-common.js"></script>
<script src="/intake-i18n.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const t = I18N.t, F = I18N.f;
  const form = $('intakeForm');
  const steps = [...document.querySelectorAll('.step')];
  const NAMES = ['About you', 'Training', 'Nutrition', 'Review'];
  const MULTI = ['goal', 'sport', 'equipment', 'emphasis', 'commitment_days', 'diet'];
  const DRAFT = 'fp_intake_draft';
  let cur = 0, last = null;

  // ---------- helpers ----------
  const checked = (name) => [...form.querySelectorAll('input[name="' + name + '"]:checked')].map((i) => i.value);
  const num = (id) => parseFloat($(id).value) || 0;

  function collect() {
    const fd = new FormData(form);
    const a = {};
    for (const [k, v] of fd.entries()) {
      if (k === 'website') continue;
      const val = String(v).trim();
      if (MULTI.includes(k)) { (a[k] = a[k] || []).push(val); continue; }
      if (val !== '') a[k] = val;
    }
    document.querySelectorAll('.other[hidden]').forEach((i) => delete a[i.name]);
    if (a.two_a_day !== 'Yes') delete a.two_a_day_days;
    if (a.has_commitments !== 'Yes') { delete a.commitment_days; delete a.commitment_details; }
    if (a.targets_mode !== 'I have my own targets') ['protein_g', 'carbs_g', 'fats_g', 'calories'].forEach((k) => delete a[k]);
    if (a.targets_mode !== 'Calculate for me') delete a.activity_level;
    return a;
  }

  // ---------- live widgets ----------
  function live() {
    // "Other" inputs
    document.querySelectorAll('.other').forEach((inp) => { inp.hidden = !checked(inp.dataset.for).includes('Other'); });
    const c = checked('has_commitments')[0];
    $('commitBox').hidden = c !== 'Yes';
    $('twiceBox').hidden = checked('two_a_day')[0] !== 'Yes';
    const tm = checked('targets_mode')[0];
    $('ownTargets').hidden = tm !== 'I have my own targets';
    $('calcTargets').hidden = tm !== 'Calculate for me';

    // BMI
    const h = num('height_cm') / 100, w = num('weight_kg');
    if (h > 1 && w > 20) {
      const bmi = w / (h * h);
      const cat = bmi < 18.5 ? ['Underweight', 'warn'] : bmi < 25 ? ['Normal range', 'ok'] : bmi < 30 ? ['Above normal', 'warn'] : ['High', 'bad'];
      $('bmiBox').innerHTML = 'BMI <b>' + bmi.toFixed(1) + '</b> <span class="tag ' + cat[1] + '">' + t(cat[0]) + '</span>';
      $('bmiBox').hidden = false;
    } else $('bmiBox').hidden = true;

    // Target diff
    const tw = num('target_weight_kg');
    if (w > 20 && tw > 20) {
      const d = tw - w;
      $('targetBox').innerHTML = Math.abs(d) < 0.05 ? t('Target equals current weight') :
        '<b>' + (d > 0 ? '+' : '−') + Math.abs(d).toFixed(1) + ' kg</b> ' + t(d > 0 ? 'to gain' : 'to lose');
      $('targetBox').hidden = false;
    } else $('targetBox').hidden = true;

    // Sliders
    const days = +$('days_per_week').value, mins = +$('session_minutes').value;
    $('daysVal').textContent = F.days(days);
    $('minVal').textContent = F.mins(mins);
    const tot = days * mins;
    $('volumeBox').innerHTML = F.volume((tot / 60).toFixed(1).replace('.0', ''));
    fill($('days_per_week')); fill($('session_minutes')); fill($('water_ml'));

    // Water
    const ml = +$('water_ml').value;
    $('waterVal').textContent = F.water(parseFloat((ml / 1000).toFixed(2)));
    const n = Math.round(ml / 250);
    $('glasses').innerHTML = '💧'.repeat(n) + '<small>' + F.glasses(n) + '</small>';

    // Macros
    const p = num('protein_g'), cb = num('carbs_g'), f = num('fats_g');
    const kcal = p * 4 + cb * 4 + f * 9;
    $('calories').value = kcal ? Math.round(kcal) : '';
    if (kcal) {
      const pc = (x) => (x / kcal * 100);
      const bar = $('macroBar').children;
      bar[0].style.width = pc(p * 4) + '%'; bar[1].style.width = pc(cb * 4) + '%'; bar[2].style.width = pc(f * 9) + '%';
      $('macroBar').hidden = false;
      $('macroLegend').innerHTML = '<span class="p">' + t('Protein') + ' ' + Math.round(pc(p * 4)) + '%</span><span class="c">' + t('Carbs') + ' ' + Math.round(pc(cb * 4)) + '%</span><span class="f">' + t('Fats') + ' ' + Math.round(pc(f * 9)) + '%</span>' +
        (w > 20 && p ? '<span>' + (p / w).toFixed(1) + ' ' + t('g protein / kg') + '</span>' : '');
    } else { $('macroBar').hidden = true; $('macroLegend').innerHTML = ''; }
  }
  function fill(r) { const pct = (r.value - r.min) / (r.max - r.min) * 100; r.style.setProperty('--pct', pct + '%'); }

  // ---------- steps ----------
  function show(i) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    steps.forEach((s, k) => s.classList.toggle('active', k === cur));
    document.querySelectorAll('#stepDots button').forEach((b, k) => { b.classList.toggle('on', k === cur); b.classList.toggle('done', k < cur); });
    $('progBar').style.width = ((cur + 1) / steps.length * 100) + '%';
    $('stepHint').textContent = F.step(cur + 1, steps.length, NAMES[cur]);
    $('submitBtn').textContent = t('Submit');
    $('backBtn').hidden = cur === 0;
    $('nextBtn').hidden = cur === steps.length - 1;
    $('submitBtn').hidden = cur !== steps.length - 1;
    $('formErr').textContent = '';
    if (cur === steps.length - 1) renderReview();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function valid(i) { return !(i === 0 && !$('full_name').value.trim()); }
  function fail(k) {
    if (k !== cur) show(k);
    $('formErr').textContent = t('Please enter a name to continue.');
    $('full_name').classList.add('bad'); $('full_name').focus();
  }
  function go(i) { if (i > cur) { for (let k = 0; k < i; k++) if (!valid(k)) return fail(k); } show(i); }
  $('nextBtn').onclick = () => go(cur + 1);
  $('backBtn').onclick = () => show(cur - 1);
  document.querySelectorAll('#stepDots button').forEach((b) => (b.onclick = () => go(+b.dataset.go)));
  $('full_name').addEventListener('input', (e) => e.target.classList.remove('bad'));
  form.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && cur < steps.length - 1) { e.preventDefault(); go(cur + 1); }
  });

  function renderReview() {
    const a = collect();
    const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    $('review').innerHTML = INTAKE.SECTIONS.map(([title, fields], i) => {
      const rows = fields.filter(([k]) => !INTAKE.empty(a[k])).map(([k, l]) => '<div class="kv"><span>' + esc(t(l)) + '</span><span>' + esc(INTAKE.fmt([].concat(a[k]).map(t))) + '</span></div>').join('');
      return '<div class="revsec" data-go="' + i + '"><h4>' + esc(t(title)) + ' <small>' + t('Edit') + '</small></h4>' + (rows || '<div class="muted">' + t('Nothing filled in') + '</div>') + '</div>';
    }).join('');
    $('review').querySelectorAll('.revsec').forEach((el) => (el.onclick = () => show(+el.dataset.go)));
  }

  // ---------- draft autosave ----------
  function saveDraft() {
    try {
      localStorage.setItem(DRAFT, JSON.stringify(collectRaw()));
      $('savedNote').textContent = t('Draft saved on this device');
    } catch (e) {}
  }
  function collectRaw() {
    const o = {};
    form.querySelectorAll('input,select,textarea').forEach((el) => {
      if (!el.name || el.name === 'website') return;
      if (el.type === 'checkbox' || el.type === 'radio') { if (el.checked) (o[el.name] = o[el.name] || []).push(el.value); }
      else o[el.name] = el.value;
    });
    return o;
  }
  function loadDraft() {
    let o; try { o = JSON.parse(localStorage.getItem(DRAFT) || 'null'); } catch (e) {}
    if (!o) return;
    form.querySelectorAll('input,select,textarea').forEach((el) => {
      if (!(el.name in o)) return;
      if (el.type === 'checkbox' || el.type === 'radio') el.checked = o[el.name].includes(el.value);
      else el.value = o[el.name];
    });
    $('savedNote').textContent = t('Restored your saved draft');
  }
  function clearDraft() { try { localStorage.removeItem(DRAFT); } catch (e) {} $('savedNote').textContent = ''; }

  let saveTimer;
  form.addEventListener('input', () => { live(); clearTimeout(saveTimer); saveTimer = setTimeout(saveDraft, 400); });
  form.addEventListener('change', (e) => {
    if (e.target.name === 'diet') {
      const boxes = form.querySelectorAll('input[name="diet"]');
      if (e.target.value === 'None' && e.target.checked) boxes.forEach((b) => { if (b !== e.target) b.checked = false; });
      else if (e.target.checked) boxes.forEach((b) => { if (b.value === 'None') b.checked = false; });
    }
    if (e.target.name === 'emphasis') {
      const boxes = form.querySelectorAll('input[name="emphasis"]');
      if (e.target.value === 'Balanced' && e.target.checked) boxes.forEach((b) => { if (b !== e.target) b.checked = false; });
      else if (e.target.checked) boxes.forEach((b) => { if (b.value === 'Balanced') b.checked = false; });
    }
    live(); saveDraft();
  });

  // ---------- submit ----------
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (cur !== steps.length - 1) return go(cur + 1);
    if (!valid(0)) return fail(0);
    const answers = collect();
    const btn = $('submitBtn');
    btn.disabled = true; btn.textContent = t('Sending…');
    try {
      const r = await fetch('/api/intake', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ answers, website: form.website.value }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || 'Something went wrong');
      last = { answers, created_at: d.created_at || new Date().toISOString() };
      $('summary').textContent = INTAKE.toText(answers, last, t);
      clearDraft();
      form.hidden = true; document.querySelector('.steps').hidden = true; $('progBar').style.width = '100%';
      $('stepHint').textContent = t('Done');
      $('doneBox').hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
      $('formErr').textContent = err.message === 'Failed to fetch' ? t('Network error, please try again.') : t(err.message);
    }
    btn.disabled = false; btn.textContent = t('Submit');
  });

  $('copyBtn').onclick = async () => {
    const ok = await INTAKE.copy($('summary').textContent);
    $('copyBtn').textContent = t(ok ? 'Copied ✓' : 'Copy failed');
    setTimeout(() => ($('copyBtn').textContent = t('Copy answers')), 1500);
  };
  $('dlBtn').onclick = () => last && INTAKE.download('intake-' + INTAKE.slug(last.answers.full_name) + '.json', JSON.stringify(last, null, 2));
  $('againBtn').onclick = () => {
    form.reset(); clearDraft(); live();
    $('doneBox').hidden = true; form.hidden = false; document.querySelector('.steps').hidden = false; show(0);
  };

  window.addEventListener('pagehide', () => { if (!form.hidden) saveDraft(); });
  // ---------- language ----------
  function applyLang() {
    I18N.applyStatic(document.body);
    $('langBtn').textContent = I18N.lang === 'ar' ? 'English' : 'الدارجة';
    $('copyBtn').textContent = t('Copy answers');
    if (last) $('summary').textContent = INTAKE.toText(last.answers, last, t);
    live();
    if (!form.hidden) show(cur); else $('stepHint').textContent = t('Done');
  }
  $('langBtn').onclick = () => { I18N.set(I18N.lang === 'ar' ? 'en' : 'ar'); $('savedNote').textContent = ''; applyLang(); };

  loadDraft(); live(); show(0); applyLang();
})();
</script>
</body>
</html>
